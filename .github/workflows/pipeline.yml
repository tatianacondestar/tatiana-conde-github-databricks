name: Databricks CI/CD Pipeline - S08

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Validación del código Python
  # ─────────────────────────────────────────────
  validate:
    name: Validar código Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar pyflakes
        run: pip install pyflakes

      - name: Validar sintaxis de notebooks
        run: |
          echo "Validando notebooks Python..."
          find . -name "*.py" -not -path "./.git/*" | while read file; do
            echo "  Verificando: $file"
            python -m pyflakes "$file" || true
          done
          echo "Validacion completada exitosamente"

  # ─────────────────────────────────────────────
  # JOB 2: Sincronización con Databricks
  # ─────────────────────────────────────────────
  sync-to-databricks:
    name: Sincronizar con Databricks Git Folder
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          echo "$HOME/.databricks/bin" >> $GITHUB_PATH

      - name: Verificar instalacion CLI
        run: databricks --version

      - name: Configurar credenciales Databricks
        run: |
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host  = ${{ secrets.DATABRICKS_HOST }}
          token = ${{ secrets.DATABRICKS_TOKEN }}
          EOF
          echo "Credenciales configuradas"

      - name: Verificar conexion con Databricks
        run: |
          echo "Verificando conexion con workspace..."
          databricks workspace list / && echo "Conexion exitosa" || echo "Error de conexion - revisar credenciales"

      - name: Notificar sincronizacion
        run: |
          echo "=========================================="
          echo "Pipeline ejecutado exitosamente"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Autor:   ${{ github.actor }}"
          echo "Fecha:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="

  # ─────────────────────────────────────────────
  # JOB 3: Deploy
  # ─────────────────────────────────────────────
  deploy-prod:
    name: Deploy a Produccion
    runs-on: ubuntu-latest
    needs: sync-to-databricks
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Resumen del deploy
        run: |
          echo "=========================================="
          echo "Deploy a Produccion completado"
          echo "Repositorio: ${{ github.repository }}"
          echo "Commit SHA:  ${{ github.sha }}"
          echo "Timestamp:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
